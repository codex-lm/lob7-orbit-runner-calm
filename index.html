<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Runner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <h1>Orbit Runner</h1>
  <div class="hud" aria-live="polite">
    <span class="hud-item">Score: <strong id="score">0</strong></span>
    <span class="hud-item">Lives: <strong id="lives">♥♥♥</strong></span>
    <span class="hud-item" id="phase">Ready — press Start</span>
  </div>
  <canvas id="game" width="640" height="640" role="img" tabindex="0"
    aria-label="Orbit Runner play field: a ship orbiting a star on two lanes"></canvas>
  <div class="controls">
    <button id="startBtn" type="button">Start</button>
    <button id="pauseBtn" type="button" disabled>Pause</button>
  </div>
  <p class="hint" id="hint">
    Space, arrow keys or tap: switch orbit lane · P or Escape: pause ·
    Dodge asteroids, collect crystals, reach the target score.
  </p>
</main>
<script src="game.js"></script>
</body>
</html>
